/* ---------- audio ---------- */
async function buildAudio(){const sr=48000,oc=new OfflineAudioContext(2,sr*DUR,sr);
const nb=oc.createBuffer(1,sr*3,sr),d=nb.getChannelData(0);let s=1;for(let i=0;i<d.length;i++){s=(s*1664525+1013904223)>>>0;d[i]=s/2147483648-1}
const out=oc.createGain();out.gain.value=.8;const lim=oc.createDynamicsCompressor();out.connect(lim);lim.connect(oc.destination);
const env=(g,t0,a,pk,dec)=>{g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(pk,t0+a);g.gain.exponentialRampToValueAtTime(.0001,t0+a+dec)};
const route=(n,pan=0)=>{const p=oc.createStereoPanner();p.pan.value=pan;n.connect(p);p.connect(out)};
const osc=(type,f0,f1,t0,dur,pk,a,dec,pan,filt)=>{const o=oc.createOscillator(),g=oc.createGain();o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(f1,t0+dur);env(g,t0,a,pk,dec);let n=o;if(filt){const f=oc.createBiquadFilter();f.type='lowpass';f.frequency.value=filt;o.connect(f);n=f}n.connect(g);route(g,pan);o.start(t0);o.stop(t0+a+dec+.05)};
const noise=(t0,off,dur,type,f0,f1,q,pk,a,dec,pan)=>{const n=oc.createBufferSource();n.buffer=nb;const f=oc.createBiquadFilter(),g=oc.createGain();f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t0);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t0+dur);env(g,t0,a,pk,dec);n.connect(f);f.connect(g);route(g,pan);n.start(t0,off);n.stop(t0+a+dec+.05)};
const prog=[[220,261.6,329.6,392],[174.6,220,261.6,349.2],[196,246.9,293.7,392],[164.8,207.7,246.9,329.6],[220,277.2,329.6,440],[174.6,220,261.6,349.2],[196,246.9,293.7,392],[220,261.6,329.6,392]];
for(let b=0;b<30;b++){const t=b*.5;osc('sine',150,42,t,.16,.95,.003,.3,0);

if(b%2)noise(t,0.3,0,'bandpass',1600,0,.9,.5,.002,.13,0);
if(b%4==0){const ch=prog[b/4];ch.forEach((f,i)=>{[-6,6].forEach((dt,j)=>osc('sawtooth',f*(i?1:.5),f*(i?1:.5),t,1,.05,.01,.7,(j?.35:-.35),1400))})}}

return oc.startRendering()}
function toWav(buf){const n=buf.length,d=new DataView(new ArrayBuffer(44+n*4)),w=(o,s)=>[...s].forEach((ch,i)=>d.setUint8(o+i,ch.charCodeAt(0)));w(0,'RIFF');d.setUint32(4,36+n*4,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,2,true);d.setUint32(24,buf.sampleRate,true);d.setUint32(28,buf.sampleRate*4,true);d.setUint16(32,4,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*4,true);
const L=buf.getChannelData(0),R=buf.getChannelData(1);let o=44;for(let i=0;i<n;i++){d.setInt16(o,clamp(L[i],-1,1)*32767,true);d.setInt16(o+2,clamp(R[i],-1,1)*32767,true);o+=4}return new Blob([d],{type:'audio/wav'})}

/* ---------- seek + visual loop & integration ---------- */
let T = 0;
const $ = id => document.getElementById(id);
const authEl = $('auth');
const skipBtn = $('skipBtn');
const iframeEl = $('af');

window.seek = function(t) {
  T = clamp(t, 0, TOTAL);
  draw(T);
  if (authEl) {
    authEl.classList.toggle('on', T >= 16.5);
  }
  if (skipBtn) {
    skipBtn.style.display = T >= 16.5 ? 'none' : 'inline-flex';
  }
};

try {
  iframeEl.srcdoc = AUTH_HTML;
} catch(e) {
  console.warn('Failed to set srcdoc:', e);
}

function fitCv() {
  const a = $('view');
  const vw = window.innerWidth || (a ? a.clientWidth : 0) || W;
  const vh = window.innerHeight || (a ? a.clientHeight : 0) || H;
  const s = Math.min(vw / W, vh / H);
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
  if (authEl) authEl.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fitCv);
window.addEventListener('orientationchange', fitCv);
if (window.ResizeObserver) {
  try {
    new ResizeObserver(fitCv).observe(document.body);
  } catch(e){}
}
setTimeout(fitCv, 50);
setTimeout(fitCv, 200);
setTimeout(fitCv, 600);
fitCv();

let playing = false, animStartTime = 0;
let ac = null, srcN = null, audioBuf = null;

function stop() {
  playing = false;
  if (srcN) {
    try { srcN.stop(); } catch(e){}
    srcN = null;
  }
}

function startVisualAnimation() {
  if (playing) return;
  playing = true;
  animStartTime = performance.now() - T * 1000;

  function tick(now) {
    if (!playing) return;
    const elapsed = (now - animStartTime) / 1000;
    if (elapsed >= TOTAL) {
      stop();
      seek(TOTAL);
      return;
    }
    seek(elapsed);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Background Web Audio playback if supported
  try {
    getAudio().then(buf => {
      audioBuf = buf;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        ac = ac || new AudioCtx();
        if (ac.state === 'running' && playing && T < TOTAL) {
          srcN = ac.createBufferSource();
          srcN.buffer = buf;
          srcN.connect(ac.destination);
          srcN.start(0, T);
        }
      }
    }).catch(err => {
      console.warn('Web Audio synthesis bypassed:', err);
    });
  } catch(e){}
}

window.addEventListener('pointerdown', () => {
  if (ac && ac.state === 'suspended') {
    ac.resume().catch(() => {});
  }
  if (audioBuf && !srcN && playing && T < TOTAL) {
    try {
      srcN = ac.createBufferSource();
      srcN.buffer = audioBuf;
      srcN.connect(ac.destination);
      srcN.start(0, T);
    } catch(e){}
  }
}, { once: true });

if (skipBtn) {
  skipBtn.addEventListener('click', () => {
    stop();
    seek(17);
    skipBtn.style.display = 'none';
  });
}

// Forward child auth messages to desktop React app
window.addEventListener('message', e => {
  if (e.data) {
    if (e.data.ovCard && e.data.ovCard.w > 300) {
      CARD = e.data.ovCard;
      applyCard();
      seek(T);
    }
    if (e.data.type && e.data.type.startsWith('ovilo_')) {
      try { window.parent.postMessage(e.data, '*'); } catch(err){}
    }
  }
});

// Start immediately on load
seek(0);
draw(0);

Promise.race([
  Promise.all(['400','600','700','800','900'].map(w => document.fonts.load(w + ' 100px Inter'))),
  new Promise(r => setTimeout(r, 400))
]).then(() => {
  for (const k in wcache) delete wcache[k];
  seek(0);
  startVisualAnimation();
}).catch(() => {
  seek(0);
  startVisualAnimation();
});
