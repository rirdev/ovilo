    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- OVILO Global Ad & Popup Shield -->
    <script>
      (function() {
        const noopWindow = {
          closed: false,
          close: function() {},
          focus: function() {},
          blur: function() {},
          postMessage: function() {},
          location: { href: 'about:blank' }
        };
        try {
          const originalOpen = window.open;
          window.open = function(url, target, features) {
            if (window.event && window.event.isTrusted) {
              return originalOpen ? originalOpen.call(window, url, target, features) : noopWindow;
            }
            if (url && (
              url.includes('accounts.google.com') ||
              url.includes('firebaseapp.com') ||
              url.includes('github.com') ||
              url.startsWith('/') ||
              url.startsWith(window.location.origin)
            )) {
              return originalOpen ? originalOpen.call(window, url, target, features) : noopWindow;
            }
            console.warn('[OVILO Ad Shield] Intercepted and blocked unprompted popup:', url);
            return noopWindow;
          };
        } catch (e) {}
      })();
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            var root = document.getElementById('root');
            if (root && root.children.length === 0) {
              root.innerHTML = '<div style="display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;background:#0c0c0e;color:#fff;font-family:sans-serif;text-align:center"><div style="max-width:540px;background:#18181b;padding:36px;border-radius:24px;border:1px solid #27272a;box-shadow:0 20px 50px rgba(0,0,0,0.6)"><div style="width:54px;height:54px;border-radius:50%;background:#ffd24d;color:#141414;display:grid;place-items:center;margin:0 auto 18px;font-size:24px;font-weight:900">!</div><h2 style="font-size:22px;margin-bottom:12px;font-weight:800">Local Web Server Required</h2><p style="color:#a1a1aa;font-size:14px;line-height:1.6;margin-bottom:20px">Modern browser security blocks ES Modules and APIs when opening files via <code style=\"background:#27272a;color:#ffd24d;padding:2px 6px;border-radius:6px\">file://</code> directly.<br><br><b>On Netlify, Vercel, or a local server</b>, Ovilo Web works automatically over HTTP/HTTPS!</p><div style="background:#09090b;padding:14px;border-radius:12px;border:1px solid #27272a;font-family:monospace;font-size:13px;color:#e4e4e7;margin-bottom:20px;text-align:left"><div style="color:#71717a"># To test locally:</div><div>cd web_version &amp;&amp; npm run dev</div></div><a href="http://localhost:5173" target="_blank" style="display:inline-block;background:#ffd24d;color:#141414;font-weight:800;padding:10px 22px;border-radius:100px;text-decoration:none;font-size:14px">Open Local Dev Server (5173) ↗</a></div></div>';
            }
          }, 1200);
        });
      }
    </script>
