[build]
  command = "cd web_version && npm run build && cd .. && rm -rf dist_site && cp -r website dist_site && cp -r web_version/dist dist_site/app"
  publish = "dist_site"

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/downloads/ovilo-0.1.0-x86_64.AppImage"
  to = "https://github.com/rirdev/ovilo/releases/download/v0.1.0/OVILO_0.1.0_amd64.AppImage"
  status = 302
  force = false

[[redirects]]
  from = "/downloads/ovilo_0.1.0_amd64.deb"
  to = "https://github.com/rirdev/ovilo/releases/download/v0.1.0/OVILO_0.1.0_amd64.deb"
  status = 302
  force = false

[[redirects]]
  from = "/downloads/ovilo-0.1.0-1.x86_64.rpm"
  to = "https://github.com/rirdev/ovilo/releases/download/v0.1.0/OVILO-0.1.0-1.x86_64.rpm"
  status = 302
  force = false

[[redirects]]
  from = "/downloads/*"
  to = "https://github.com/rirdev/ovilo/releases/download/v0.1.0/:splat"
  status = 302
  force = false

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
